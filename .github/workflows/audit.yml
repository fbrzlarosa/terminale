name: Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

env:
  # Opt JS-based actions into Node 24 now (Node 20 is deprecated on runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run cargo-audit directly rather than via rustsec/audit-check@v2: the
      # action does not honour the `[advisories] ignore` list in
      # `.cargo/audit.toml`, so it fails on advisories we have deliberately
      # accepted (unmaintained transitive font-stack crates, and quick-xml
      # instances blocked by a direct parent's caret bound). `cargo audit`
      # reads that ignore list, so this gate matches `cargo deny check` and the
      # local `cargo audit --deny warnings` verification.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (honours .cargo/audit.toml ignores)
        run: cargo audit --deny warnings

  cargo-deny:
    name: cargo-deny (licenses + sources + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    # Blocking. The repository is public, so CodeQL code scanning runs for
    # real and for free; the old `continue-on-error` was there only to keep
    # Audit green while the repo was private and the action failed with
    # "repository not found". Note this gate fails on a broken *analysis*
    # (extraction or upload), never on the alerts it finds — `analyze` has no
    # failure threshold configured.
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Needed by the build scripts CodeQL's Rust extractor runs (wayland,
      # xcb, fontconfig and friends all probe the system via pkg-config).
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: rust
      # No `cargo build` step: Rust is a build-mode `none` language for CodeQL
      # (its only supported mode). Extraction goes through rust-analyzer, which
      # compiles build scripts and macros itself, so a full workspace build fed
      # the analysis nothing and cost ten minutes of every run.
      - uses: github/codeql-action/analyze@v4.37.9

  unsafe-review:
    name: cargo-geiger (unsafe code report)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger --workspace --output-format json > geiger-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: geiger-report.json
